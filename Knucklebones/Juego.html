<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <!--Union con el javaScript-->
    <!--defer: Para que se descargue en segundo plano el js y se ejecute tras se cargue el html-->
    <script defer src="..\Knucklebones\js\Juego.js"></script>
    <!--Union con el css--> 
    <link href="..\Knucklebones\css\Juego.css" rel="stylesheet" type="text/css">

    <!--Vínculo de las fuentes de GoogleFonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,opsz,wght@0,8..30,100..900;1,8..30,100..900&display=swap" rel="stylesheet">

    <link rel="shortcut icon" href="..\Knucklebones\Assets\img\Site-favicon.png" >
    <title>Knucklebones</title>
</head>
<body>
    <!--No se acepta el uso del JavaScript por cualquier razón-->
    <noscript>
        <p>Este mensaje solo se muestra si JavaScript está desactivado</p>
    </noscript>
    <!--Música-->
    <button id="BotonMusica" onclick="controlBGMusica()"></button>

    <div id="selectorGanador">
        <p>Texto que muestra que jugador ha ganado</p>
        <button onclick="reiniciarPartida()">Volver a jugar</button>
    </div>

    <section>
        <div id="ContenedorGeneral">
            <!--Contenedor Tablero A-->
            <p id="selectorTurno">Turno de jugador A</p>
            <div id="ContenedorTableros">
                <!--Personaje-->
                <img id="PersonajeA" src="Assets/img/cordero_idle.gif" alt="favicon" class="personaje">
                <!--Jugador A-->
                <div id="JugadorA"  class="jugador">
                    <p id="puntuacionA">Puntuación: 0</p>
                    <div id="TableroA">
                        <div data-columna="0" class="ColumnasT">
                            <div class="FilasT"><p>&nbsp</p></div>
                            <div class="FilasT"><p>&nbsp</p></div>
                            <div class="FilasT"><p>&nbsp</p></div>
                        </div>
                        <div data-columna="1" class="ColumnasT">
                            <div  class="FilasT"><p>&nbsp</p></div>
                            <div class="FilasT"><p>&nbsp</p></div>
                            <div class="FilasT"><p>&nbsp</p></div>
                        </div>
                        <div data-columna="2" class="ColumnasT">
                            <div class="FilasT"><p>&nbsp</p></div>
                            <div class="FilasT"><p>&nbsp</p></div>
                            <div class="FilasT"><p>&nbsp</p></div>
                        </div>
                    </div>
                </div>
                <img src="Assets/img/cabra_idle.gif" alt="favicon" class="ObjetoInvisible">
            </div>
            <!--Dado-->
            <div id="Dado"><p>Dado</p></div>
            <!--Contenedor Tablero A-->
            <div id="ContenedorTableros">
                <img src="Assets/img/cabra_idle.gif" alt="favicon" class="ObjetoInvisible">
                <!--TableroB-->
                <div id="JugadorB" class="jugador">
                    <div id="TableroB">
                        <div data-columna="0" class="ColumnasT">
                            <div class="FilasT"><p>&nbsp</p></div>
                            <div class="FilasT"><p>&nbsp</p></div>
                            <div class="FilasT"><p>&nbsp</p></div>
                        </div>
                        <div data-columna="1" class="ColumnasT">
                            <div  class="FilasT"><p>&nbsp</p></div>
                            <div class="FilasT"><p>&nbsp</p></div>
                            <div class="FilasT"><p>&nbsp</p></div>
                        </div>
                        <div data-columna="2" class="ColumnasT">
                            <div class="FilasT"><p>&nbsp</p></div>
                            <div class="FilasT"><p>&nbsp</p></div>
                            <div class="FilasT"><p>&nbsp</p></div>
                        </div>
                    </div>
                    <p id="puntuacionB">Puntuación: 0</p>
                </div>
                <!--Personaje-->
                <img id="PersonajeB" src="Assets/img/cabra_idle.gif" alt="favicon" class="personaje">
            </div>
        <div>
    </section>
    


    
</body>
</html>
